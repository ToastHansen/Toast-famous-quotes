<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famous Quotes</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon">❝</span>
        <h1 class="header-title">Famous Quotes</h1>
      </div>
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle dark/light mode">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- ===== RANDOM QUOTE HERO ===== -->
    <section class="hero-section" aria-label="Random quote of the moment">
      <div id="random-quote-card" class="quote-card hero-card" aria-live="polite">
        <div class="card-loading">
          <div class="spinner"></div>
          <p>Loading a quote for you…</p>
        </div>
      </div>
      <button id="new-quote-btn" class="btn btn-primary">
        ✨ New Quote
      </button>
    </section>

    <!-- ===== SEARCH & FILTER ===== -->
    <section class="search-section" aria-label="Search and filter quotes">
      <h2 class="section-title">Browse All Quotes</h2>
      <div class="search-controls">
        <div class="input-group">
          <label for="author-input" class="input-label">Search by Author</label>
          <input
            id="author-input"
            type="text"
            class="input-field"
            placeholder="e.g. Einstein, Twain…"
            autocomplete="off"
            list="authors-datalist"
            aria-label="Filter by author name"
          />
          <datalist id="authors-datalist"></datalist>
        </div>
        <div class="input-group">
          <label for="category-select" class="input-label">Filter by Category</label>
          <select id="category-select" class="input-field select-field" aria-label="Filter by category">
            <option value="">All Categories</option>
          </select>
        </div>
        <button id="clear-btn" class="btn btn-secondary" title="Clear all filters">
          ✕ Clear
        </button>
      </div>
    </section>

    <!-- ===== RESULTS ===== -->
    <section class="results-section" aria-label="Quote results">
      <div id="results-meta" class="results-meta" aria-live="polite"></div>
      <div id="results-grid" class="results-grid" aria-live="polite">
        <!-- Quote cards injected by JS -->
      </div>
      <div id="no-results" class="no-results hidden" role="status">
        <span class="no-results-icon">🔍</span>
        <p>No quotes found. Try a different search.</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>100 curated quotes from the world's greatest minds.</p>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
